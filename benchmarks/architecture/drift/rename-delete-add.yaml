version: 1
id: drift-rename-delete-add
experiment: drift_detection
scenario: rename delete plus add
treatment:
  name: architecture_gate
  baseline: {architecture_mode: "off"}
  adaptive: {architecture_mode: required}
inputs:
  task: {declared_modules: [app], protected_paths: [], adopted_paths: []}
  architecture:
    version: 1
    modules:
    - {id: app, name: Application, responsibility: Run application behavior., depends_on: [], evidence: [{type: source, path: src/app.py}]}
    - {id: shared, name: Shared, responsibility: Provide shared behavior., depends_on: [], evidence: [{type: source, path: src/shared.py}]}
    ownership:
    - {id: OWN-001, pattern: 'src/app/**', kind: production, modules: [app]}
    - {id: OWN-002, pattern: 'src/shared/**', kind: production, modules: [shared]}
  git:
  - {path: src/app/old.py, kind: committed}
  - {path: src/shared/new.py, kind: worktree}
expected:
  label: drift
  blockers: [{code: ARCHITECTURE_SCOPE_DRIFT, source: 'module:shared'}]
  diagnostics: []
  expected_modules: [app, shared]
  declaration_quality: complete
