version: 1
id: drift-normal-ownership
experiment: drift_detection
scenario: normal ownership
treatment:
  name: architecture_gate
  baseline: {architecture_mode: "off"}
  adaptive: {architecture_mode: required}
inputs:
  task:
    declared_modules: [app]
    protected_paths: []
    adopted_paths: []
  architecture:
    version: 1
    modules:
    - id: app
      name: Application
      responsibility: Run application behavior.
      depends_on: []
      evidence: [{type: source, path: src/app.py}]
    ownership:
    - id: OWN-001
      pattern: src/app/**
      kind: production
      modules: [app]
  git: [{path: src/app/change.py, kind: worktree}]
expected:
  label: clean
  blockers: []
  diagnostics: []
  expected_modules: [app]
  declaration_quality: complete
