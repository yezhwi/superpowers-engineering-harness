version: 1
id: drift-adopted-protected
experiment: drift_detection
scenario: adopted protected paths
treatment:
  name: architecture_gate
  baseline: {architecture_mode: "off"}
  adaptive: {architecture_mode: required}
inputs:
  token_budget: 4096
  task:
    declared_modules: [app]
    protected_paths: ['generated/**']
    adopted_paths: ['generated/**']
  architecture:
    version: 1
    modules:
    - {id: app, name: Application, responsibility: Run application behavior., depends_on: [], evidence: [{type: source, path: src/app.py}]}
    - {id: shared, name: Shared, responsibility: Provide shared behavior., depends_on: [], evidence: [{type: source, path: src/shared.py}]}
    ownership:
    - {id: OWN-001, pattern: 'generated/**', kind: production, modules: [shared]}
  git: [{path: generated/client.py, kind: modified}]
expected:
  label: drift
  blockers: [{code: ARCHITECTURE_SCOPE_DRIFT, source: 'path:generated/client.py|module:shared'}]
  diagnostics: []
  expected_modules: [shared]
  declaration_quality: complete
