gate:

  requirements:
    must_verified: true
    uncovered_allowed: 0

  invariants:
    # NOTE: no violated_allowed knob - ANY violated invariant blocks, by law.
    minor_verified: false   # true => even minor invariants must be verified

  fast:
    verification:
      build: required
      typecheck: optional

  verification:
    build: required
    unit_test: required
    integration_test: optional

  verification_commands:
    build: "python -m pip wheel --no-deps --no-build-isolation ."
    unit_test: "pytest"

  complexity:
    required: true
    blocking:
      - high

  diagnosability:
    standard: required_when_contract_required
    strict: required
    blocking: [critical, major]

  findings:
    critical_allowed: 0
    major_allowed: 0

  regression:
    confirmed_finding_without_test: 0

  release:
    full_suite_required: false

  convergence:
    max_iterations: 5
