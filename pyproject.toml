[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superpowers-engineering-harness"
version = "0.2.2"
description = "Turn agent development into deterministic state, evidence, and gate-controlled delivery for humans and AI."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0", "PyYAML>=6.0"]
license = { text = "Apache-2.0" }
authors = [{ name = "Yezhiwei" }]
keywords = [
  "ai-agents", "agent-skill", "quality-gate", "state-machine",
  "evidence", "tdd", "workflow-engine", "llm",
]

[project.urls]
Homepage = "https://github.com/yezhwi/superpowers-engineering-harness"

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["schemas/*.json", "templates/*.yaml"]
